name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Content validation
        run: pnpm content:validate
      - name: Unit tests + coverage gates
        run: pnpm test:coverage
      - name: Build (Pages base path)
        run: pnpm build
        env:
          VITE_BASE: /situation-trainer/
      - name: JS size budget
        run: pnpm size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @st/web exec playwright install --with-deps chromium
      - name: Playwright smoke (390px)
        run: pnpm test:e2e
        env:
          CI: "true"
      - name: Key-screen screenshots
        if: always()
        run: pnpm --filter @st/web exec playwright test screenshots
        env:
          CI: "true"
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            screenshots
          retention-days: 14
